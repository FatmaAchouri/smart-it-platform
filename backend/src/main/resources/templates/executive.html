<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executive Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div th:replace="~{fragments/navbar :: .navbar}"></div>

    <div class="container mt-5">
        <h2 class="mb-4 text-primary">Executive Dashboard - OneTech Group</h2>

        <div class="row g-4">
            <div class="col-md-3">
                <div class="card text-white bg-primary text-center">
                    <div class="card-body">
                        <h5>Total Machines</h5>
                        <h2 th:text="${totalMachines}"></h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-success text-center">
                    <div class="card-body">
                        <h5>Active Machines</h5>
                        <h2 th:text="${activeMachines}"></h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-danger text-center">
                    <div class="card-body">
                        <h5>HS Machines</h5>
                        <h2 th:text="${hsMachines}"></h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-info text-center">
                    <div class="card-body">
                        <h5>Factory Health</h5>
                        <h2 th:text="${healthScore} + '%'"></h2>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
