<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Recommendations</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
        <nav class="navbar navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand fw-bold" href="/">Smart IT Platform</a>
                <div class="navbar-nav ms-auto d-flex align-items-center">
                    <span class="text-light me-3">
                        <i class="fas fa-user"></i> 
                        <span th:text="${#authentication.name} ?: 'Guest'"></span> 
                        (<span th:text="${#authentication.principal.authorities[0].authority} ?: 'USER'"></span>)
                    </span>
                    <a href="/machines" class="nav-link">Machines</a>
                    <a href="/tickets" class="nav-link">Tickets</a>
                    <a href="/dashboard" class="nav-link">Dashboard</a>
                    <a href="/notifications" class="nav-link">Notifications</a>
                    <a href="/logout" class="nav-link text-danger">Logout</a>
                </div>
            </div>  
        </nav>

    <div class="container mt-5">
        <h2 class="text-success">Smart Recommendations</h2>
        <p class="lead text-muted">AI-based maintenance suggestions</p>

        <div class="list-group">
            <div th:each="suggestion : ${suggestions}" class="list-group-item list-group-item-action">
                <i class="fas fa-lightbulb text-warning me-2"></i>
                <span th:text="${suggestion}"></span>
            </div>
        </div>

        <a href="/dashboard" class="btn btn-primary mt-4">Back to Dashboard</a>
    </div>
</body>
</html>
