<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${machine.id == null} ? 'Add New Machine' : 'Edit Machine'">Machine Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h4 class="mb-0">
                    <i class="fas fa-cog"></i> 
                    <span th:text="${machine.id == null} ? 'Add New Machine' : 'Edit Machine'"></span>
                </h4>
                <a href="/machines" class="btn btn-light btn-sm">Back to List</a>
            </div>
            <div class="card-body">
                <form th:action="@{/machines}" th:object="${machine}" method="post">
                    <input type="hidden" th:field="*{id}" />

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Code Équipement</label>
                            <input type="text" class="form-control" th:field="*{codeEquipement}" placeholder="e.g. 08_1">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Machine Name / Description</label>
                            <input type="text" class="form-control" th:field="*{name}" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Type / Famille</label>
                            <input type="text" class="form-control" th:field="*{type}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Brand / Constructeur</label>
                            <input type="text" class="form-control" th:field="*{brand}">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Model</label>
                            <input type="text" class="form-control" th:field="*{model}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Serial Number</label>
                            <input type="text" class="form-control" th:field="*{serialNumber}">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Production Line</label>
                            <input type="text" class="form-control" th:field="*{productionLine}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Location / Emplacement</label>
                            <input type="text" class="form-control" th:field="*{location}">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Zone</label>
                            <input type="text" class="form-control" th:field="*{zone}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Status</label>
                            <select class="form-select" th:field="*{status}">
                                <option value="NORMAL">NORMAL (En Service)</option>
                                <option value="HS">HS (Hors Service)</option>
                                <option value="Maintenance">Maintenance</option>
                                <option value="En Panne">En Panne</option>
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Purchase / Mise en Service Date</label>
                            <input type="date" class="form-control" th:field="*{purchaseDate}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Warranty End</label>
                            <input type="date" class="form-control" th:field="*{warrantyEnd}">
                        </div>
                    </div>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                        <a href="/machines" class="btn btn-secondary me-2">Cancel</a>
                        <button type="submit" class="btn btn-success">
                            <i class="fas fa-save"></i> Save Machine
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
