<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Ticket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4>Create New IT Ticket</h4>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/tickets}" th:object="${ticket}" method="post">
                            <div class="mb-3">
                                <label class="form-label">Ticket Title</label>
                                <input type="text" class="form-control" th:field="*{title}" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Machine Name</label>
                                <input type="text" class="form-control" th:field="*{machineName}">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Description / Problem</label>
                                <textarea class="form-control" rows="5" th:field="*{description}" required></textarea>
                            </div>

                            <button type="submit" class="btn btn-success btn-lg">Submit Ticket</button>
                            <a href="/tickets" class="btn btn-secondary btn-lg">Cancel</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
