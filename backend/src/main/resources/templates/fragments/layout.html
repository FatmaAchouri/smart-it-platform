<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} ?: 'Smart IT Platform'">Smart IT Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Top Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">Smart IT Platform</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/dashboard"><i class="fas fa-chart-bar"></i> Dashboard</a>
                <a class="nav-link" href="/machines"><i class="fas fa-cogs"></i> Machines</a>
                <a class="nav-link" href="/tickets"><i class="fas fa-ticket-alt"></i> Tickets</a>
                <a class="nav-link" href="/notifications"><i class="fas fa-bell"></i> Notifications</a>
                <a class="nav-link" href="/chat"><i class="fas fa-comments"></i> Chatbot</a>
                <span class="nav-link text-light">
                    <i class="fas fa-user"></i> 
                    <span th:text="${#authentication?.name} ?: 'Guest'"></span>
                </span>
                <a class="nav-link text-danger" href="/logout"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <th:block th:insert="~{::content}"></th:block>
    </div>
</body>
</html>
