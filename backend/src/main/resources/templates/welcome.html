<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>

    <title>Welcome - Smart IT Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(rgba(0, 20, 50, 0.85), rgba(0, 30, 70, 0.9)), url("/images/tech.jpg") no-repeat center center fixed;

<body>

        <div class="d-grid gap-3 col-8 mx-auto">
            <a href="/login" class="btn btn-primary btn-lg">🔑 Se Connecter</a>
            <a href="/register" class="btn btn-outline-primary btn-lg">📝 Créer un Compte</a>
        </div>
    </div>

</html>
