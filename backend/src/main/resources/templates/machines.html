<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Machines - Smart IT Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div th:replace="~{fragments/navbar :: .navbar}"></div>

    <div class="container mt-4">
        <h1 class="text-success mb-4">Industrial Machines List</h1>

        <!-- Search -->
        <div class="mb-4">
            <form class="d-flex">
                <input type="text" name="search" class="form-control me-2" placeholder="Search by name or type..." th:value="${search}">
                <button type="submit" class="btn btn-primary">Search</button>
                <a href="/machines" class="btn btn-secondary ms-2">Clear</a>
            </form>
        </div>

        <!-- Actions -->
        <div class="mb-3">
            <a href="/machines/new" class="btn btn-success">+ Add New Machine</a>
            <a href="/machines/import" class="btn btn-warning">Import from Excel</a>
            <a href="/machines/export" class="btn btn-info">Export to Excel</a>
        </div>

        <!-- Table -->
        <table class="table table-striped table-hover">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Code</th>
                    <th>Name</th>
                    <th>Type</th>
                    <th>Brand</th>
                    <th>Status</th>
                    <th>Production Line</th>
                    <th>Location</th>
                    <th>Health Score</th>
                    <th>Risque Panne</th>
                    <th>Jours Maintenance</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="machine : ${machines}">
                    <td th:text="${machine.id}"></td>
                    <td th:text="${machine.codeEquipement}"></td>
                    <td th:text="${machine.name}"></td>
                    <td th:text="${machine.type}"></td>
                    <td th:text="${machine.brand}"></td>
                    <td>
                        <span th:text="${machine.status}" 
                              class="badge" 
                              th:classappend="${machine.status == 'NORMAL' ? 'bg-success' : 'bg-danger'}">
                        </span>
                    </td>
                    <td th:text="${machine.productionLine}"></td>
                    <td th:text="${machine.location}"></td>
                    <td>
                        <span th:if="${machine.healthScore != null}" 
                              th:text="${machine.healthScore} + '%'" 
                              class="badge" 
                              th:classappend="${machine.healthScore > 70 ? 'bg-success' : machine.healthScore > 50 ? 'bg-warning' : 'bg-danger'}">
                        </span>
                    </td>
                    <td th:text="${machine.failureRisk != null ? machine.failureRisk + '%' : ''}"></td>
                    <td th:text="${machine.daysUntilMaintenance}"></td>
                    <td>
                        <a th:href="@{/machines/{id}/edit(id=${machine.id})}" class="btn btn-warning btn-sm">Edit</a>
                        <a th:href="@{/machines/{id}/delete(id=${machine.id})}" 
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('Are you sure you want to delete this machine?')">Delete</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <footer class="bg-dark text-light py-4 mt-5">
        <div class="container text-center">
            <p>© 2026 Smart IT Platform - OneTech Group • Tunisie Câbles</p>
            <small>Data Engineering Internship Project</small>
        </div>
    </footer>
</body>
</html>
