<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Assistant Chatbot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        .chat-container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .chat-header {
            background: linear-gradient(135deg, #0d6efd, #6610f2);
            color: white;
            padding: 15px;
            border-radius: 15px 15px 0 0;
        }
        .chat-body {
            height: 450px;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }
        .message {
            margin-bottom: 15px;
            max-width: 80%;
        }
        .user-message {
            margin-left: auto;
            background: #0d6efd;
            color: white;
            border-radius: 20px 20px 5px 20px;
            padding: 12px 18px;
        }
        .bot-message {
            margin-right: auto;
            background: white;
            border: 1px solid #ddd;
            border-radius: 20px 20px 20px 5px;
            padding: 12px 18px;
        }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Smart IT Platform</a>
            <a href="/dashboard" class="btn btn-light">Back to Dashboard</a>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="chat-container">
            <!-- Header -->
            <div class="chat-header text-center">
                <h4><i class="fas fa-robot"></i> IT Assistant</h4>
                <small>Smart Help for Machines & Tickets</small>
            </div>

            <!-- Chat Body -->
            <div class="chat-body" id="chat">
                <div class="bot-message">
                    Hello! I'm your IT Assistant. How can I help you today?
                </div>
            </div>

            <!-- Input -->
            <div class="p-3 border-top">
                <div class="input-group">
                    <input type="text" id="message" class="form-control" placeholder="Type your question (e.g. 'machine status')..." onkeypress="if(event.key === 'Enter') sendMessage()">
                    <button onclick="sendMessage()" class="btn btn-primary">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function sendMessage() {
            const input = document.getElementById('message');
            const chat = document.getElementById('chat');
            const msg = input.value.trim();
            if (!msg) return;

            // User message
            chat.innerHTML += `<div class="message user-message text-end">${msg}</div>`;
            input.value = '';

            // Bot response
            let response = "I'm here to help with machines and tickets!";
            if (msg.toLowerCase().includes("machine")) response = "Go to Machines page to see status and details.";
            else if (msg.toLowerCase().includes("ticket")) response = "Create a new ticket or check existing ones.";
            else if (msg.toLowerCase().includes("hello") || msg.toLowerCase().includes("hi")) response = "Hello! How can I assist you?";
            else if (msg.toLowerCase().includes("status")) response = "Check the dashboard for current status.";

            setTimeout(() => {
                chat.innerHTML += `<div class="message bot-message">${response}</div>`;
                chat.scrollTop = chat.scrollHeight;
            }, 600);
        }
    </script>

    <footer class="bg-dark text-light py-4 mt-5">
        <div class="container text-center">
            <p>© 2026 Smart IT Platform - OneTech Group • Tunisie Câbles</p>
            <small>Data Engineering Internship Project</small>
        </div>
    </footer>

</body>
</html>
