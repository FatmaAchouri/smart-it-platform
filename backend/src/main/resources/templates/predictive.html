<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predictive Maintenance - Smart IT Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div th:replace="~{fragments/navbar :: .navbar}"></div>

    <div class="container mt-5">
        <h2 class="mb-4 text-primary">Predictive Maintenance</h2>
        <p class="text-muted">AI-based failure prediction & health monitoring</p>

        <div class="row g-4">
            <div th:each="machine : ${machines}" class="col-md-6 col-lg-4">
                <div class="card shadow h-100" 
                     th:classappend="${machine.healthStatus == 'HEALTHY' ? 'border-success' : machine.healthStatus == 'WARNING' ? 'border-warning' : 'border-danger'}">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <strong th:text="${machine.name}"></strong>
                        <span class="badge" 
                              th:classappend="${machine.healthStatus == 'HEALTHY' ? 'bg-success' : machine.healthStatus == 'WARNING' ? 'bg-warning' : 'bg-danger'}">
                            <span th:text="${machine.healthStatus}"></span>
                        </span>
                    </div>
                    <div class="card-body">
                        <div class="text-center mb-3">
                            <h1 class="display-4 fw-bold" th:text="${machine.healthScore} + '%'"></h1>
                            <p class="text-muted">Health Score</p>
                        </div>

                        <div class="progress mb-3" style="height: 10px;">
                            <div class="progress-bar" 
                                 th:classappend="${machine.healthStatus == 'HEALTHY' ? 'bg-success' : machine.healthStatus == 'WARNING' ? 'bg-warning' : 'bg-danger'}"
                                 th:style="'width: ' + ${machine.healthScore} + '%'"></div>
                        </div>

                        <div class="row text-center">
                            <div class="col-6">
                                <small class="text-muted">Failure Risk</small>
                                <h5 th:text="${machine.failureRisk} + '%'"></h5>
                            </div>
                            <div class="col-6">
                                <small class="text-muted">Next Maintenance</small>
                                <h5 th:text="${machine.daysUntilMaintenance} + ' days'"></h5>
                            </div>
                        </div>
                    </div>
                    <div class="card-footer">
                        <a th:href="@{/machines/{id}(id=${machine.id})}" class="btn btn-sm btn-outline-primary">View Details</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
