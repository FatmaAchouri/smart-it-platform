<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Import Machines - Smart IT Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Smart IT Platform</a>
        </div>
    </nav>

    <div class="container mt-5">
        <h2>Import Machines from Excel</h2>

        <div class="card">
            <div class="card-body">
                <form method="post" enctype="multipart/form-data" action="/machines/import">
                    <div class="mb-3">
                        <label class="form-label">Select Excel File</label>
                        <input type="file" name="file" class="form-control" accept=".xlsx,.xls" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Import Data</button>
                </form>
            </div>
        </div>

        <div th:if="${message}" class="alert alert-info mt-3">
            <span th:text="${message}"></span>
        </div>
    </div>
</body>
</html>
