<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - Smart IT Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Top Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">Smart IT Platform</a>
            <div class="navbar-nav ms-auto d-flex align-items-center">
                <span class="text-light me-3">
                    <i class="fas fa-user"></i> 
                    <span th:text="${#authentication?.name} ?: 'Guest'"></span>
                </span>
                <a href="/dashboard" class="nav-link">Dashboard</a>
                <a href="/machines" class="nav-link">Machines</a>
                <a href="/tickets" class="nav-link">Tickets</a>
                <a href="/notifications" class="nav-link">Notifications</a>
                <a href="/chat" class="nav-link">Chatbot</a>
                <a href="/logout" class="nav-link text-danger">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h2 class="mb-4">Notifications</h2>

        <div class="list-group">
            <div th:each="notif : ${notifications}" class="list-group-item d-flex justify-content-between align-items-center">
                <div>
                    <h6 th:text="${notif.title}" class="mb-1"></h6>
                    <p th:text="${notif.message}" class="mb-1 text-muted"></p>
                    <small th:text="${notif.createdAt}" class="text-muted"></small>
                </div>
                <span th:if="${notif.read}" class="badge bg-success">Read</span>
                <span th:if="${!notif.read}" class="badge bg-danger">New</span>
            </div>
        </div>

        <div class="mt-4">
            <a href="/dashboard" class="btn btn-secondary">Back to Dashboard</a>
        </div>
    </div>
    <footer class="bg-dark text-light py-4 mt-5">
        <div class="container text-center">
            <p>© 2026 Smart IT Platform - OneTech Group • Tunisie Câbles</p>
            <small>Data Engineering Internship Project</small>
        </div>
    </footer>
</body>
</html>
